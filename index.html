<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdant Relay</title>
    <!-- Pixel UI fonts. If they can't load (offline) the UI falls back to the monospace stack in style.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Silkscreen:wght@400;700&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23181425%22/%3E%3Cpath d=%22M8 2l4 6-4 6-4-6z%22 fill=%22%232ce8f5%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="ui"></div>
      <!-- starts transparent inline: the stylesheet arrives after first paint, and its 0.35 s opacity
           transition would otherwise fade a red full-screen flash out over the title -->
      <div id="flash" style="opacity: 0"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
